<style>
:root{color-scheme:dark;--o1:#ff7a1a;--o2:#ff3b0f;--o3:#a80f06;--ink:#f1e4da;--mute:#9a8780;--sz:min(94vw,calc(100dvh - 24px),680px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

body{background:radial-gradient(ellipse at 50% 115%,#4a1006 0,transparent 55%),radial-gradient(circle at 15% 10%,#1d1416,transparent 40%),linear-gradient(165deg,#0c0809,#050304);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;overflow-x:hidden}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--o1);outline-offset:3px}
.app{position:relative;z-index:2;display:grid;grid-template-columns:auto minmax(280px,330px);gap:26px;justify-content:center;align-items:center;min-height:100dvh;padding:12px 4vw}
.bwrap{direction:ltr}
.board{width:var(--sz);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid #3a1208;box-shadow:0 0 0 2px var(--o3),0 0 36px 4px rgba(255,90,20,.45),0 0 120px 20px rgba(255,50,10,.2),inset 0 0 30px rgba(0,0,0,.8);touch-action:none;user-select:none;-webkit-user-select:none;position:relative}

.pn{text-align:center;padding:34px 40px;border:2px solid var(--o1);background:rgba(12,6,6,.85);box-shadow:0 0 70px rgba(255,80,20,.7),inset 0 0 40px rgba(255,60,10,.25);max-width:92vw}

.hd{display:flex;align-items:center;gap:10px}.hd>div{flex:1}

.board.flip{transform:rotate(180deg)}.board.flip .pc{transform:rotate(180deg)}

</style>

function go(r,c,y,x,rem){const p=S.b[r][c],o=p[0],n=ap(S,r,c,y,x),cap=n.cp;let a;
 if(p[1]==='K'&&Math.abs(x-c)===2)a=x>c?'O-O':'O-O-O';
 else a=(p[1]==='P'?(cap?'abcdefgh'[c]:''):p[1])+(cap?'x':'')+'abcdefgh'[x]+(8-y)+((p[1]==='P'&&(y===0||y===7))?'=Q':'');
 S=n;sel=null;lm=[r,c,y,x];started=true;tk=performance.now();if(cap)boom(y,x);
 const ck=inchk(S),mv=any(S);if(ck)a+=mv?'+':'#';log.push(a);logr();
 $('st').textContent=ck&&mv?'كش ملك! '+(S.t==='w'?'الأبيض':'الأسود')+' تحت التهديد':'دور '+(S.t==='w'?'الأبيض':'الأسود');
 if(!mv){draw();ck?end('كش مات','فاز '+(o==='w'?'الأبيض · الكوارتز المضيء':'الأسود · الحمم الملتهبة'),'mate'):end('تعادل','جمود: لا توجد حركة قانونية')}else{draw();after(rem,r,c,y,x)}}
const sqAt=(x,y)=>{const R=bd.getBoundingClientRect();let c=Math.floor((x-R.left)/R.width*8),r=Math.floor((y-R.top)/R.height*8);if(bd.classList.contains('flip')){r=7-r;c=7-c}return inb(r,c)?[r,c]:null};
bd.addEventListener('pointerdown',e=>{if(over||think||(me&&S.t!==me))return;const q=sqAt(e.clientX,e.clientY);if(!q)return;const[r,c]=q;

 else{if(q&&!(q[0]===d.r&&q[1]===d.c))sel=null;draw()}});
let hv=0;bd.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||RM||performance.now()-hv<60)return;hv=performance.now();for(let i=0;i<2;i++)sp(e.clientX+(Math.random()-.5)*20,e.clientY,{vx:(Math.random()-.5)*.5,vy:-.4-Math.random()*.6,l:1.4+Math.random(),s:7+Math.random()*8,k:'s'})});

const cv=$('fx'),cx=cv.getContext('2d'),P=[];let W,H,fire=false,fireUntil=0;
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
function sp(x,y,o){P.push({x,y,vx:o.vx||0,vy:o.vy||0,l:o.l||1,m:o.l||1,s:o.s||2,c:o.c||'255,120,30',g:o.g||0,k:o.k||'f'})}
function boom(r,c){const R=sq[r][c].getBoundingClientRect(),x=R.left+R.width/2,y=R.top+R.height/2,cl=['255,220,120','255,140,30','255,60,10','255,255,220'];
 for(let i=0;i<(RM?10:60);i++){const a=Math.random()*6.283,v=1.5+Math.random()*6;sp(x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.8,s:2+Math.random()*4,c:cl[i%4],g:.06})}
 for(let i=0;i<(RM?0:7);i++)sp(x+(Math.random()-.5)*30,y,{vx:(Math.random()-.5),vy:-.8-Math.random(),l:1.6,s:14+Math.random()*10,k:'s'})}
const EC=['255,150,40','255,90,20','255,200,90','255,60,10'];
function loop(){cx.clearRect(0,0,W,H);
 let n=RM?.04:fire?1.8:.35;while(n>0){if(Math.random()<Math.min(n,1))sp(Math.random()*W,H+4,{vx:(Math.random()-.5)*.5,vy:-(.5+Math.random()*1.5),l:3+Math.random()*4,s:1+Math.random()*2,c:EC[Math.random()*4|0],k:'e'});n--}
 if(fireUntil>performance.now())for(let i=0;i<18;i++)sp(Math.random()*W,H,{vx:(Math.random()-.5)*2,vy:-(3+Math.random()*8),l:1.2+Math.random()*1.6,s:6+Math.random()*14,c:EC[Math.random()*4|0],g:-.02});
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=1/60;if(p.l<=0){P.splice(i,1);continue}
  p.x+=p.vx+(p.k==='e'?Math.sin(p.l*3+p.m)*.4:0);p.y+=p.vy;p.vy+=p.g;const a=p.l/p.m;
  if(p.k==='s'){cx.globalCompositeOperation='source-over';cx.fillStyle=`rgba(95,75,75,${a*.22})`;cx.beginPath();cx.arc(p.x,p.y,p.s*(1+(1-a)*2),0,6.283);cx.fill()}
  else{cx.globalCompositeOperation='lighter';cx.fillStyle=`rgba(${p.c},${a})`;cx.beginPath();cx.arc(p.x,p.y,p.s*(.3+a*.7),0,6.283);cx.fill()}}
 requestAnimationFrame(loop)}
loop();

setInterval(()=>{if(!started||over)return;const t=performance.now(),d=(t-tk)/1000;tk=t;clk[S.t]-=d;
 if(clk[S.t]<=0){clk[S.t]=0;end('انتهى الوقت','فاز '+(S.t==='w'?'الأسود · الحمم الملتهبة':'الأبيض · الكوارتز المضيء'));return}
 $('tw').textContent=fmt(clk.w);$('tb').textContent=fmt(clk.b)},200);
/* ---- AI ---- */
const V={P:100,N:320,B:330,R:500,Q:900,K:0},LN=['سهل','متوسط','صعب','خبير'];
function ev(s){let v=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=s.b[r][c];if(!p)continue;const x=V[p[1]]+(p[1]==='P'?(p[0]==='w'?6-r:r-1)*6:p[1]==='K'?0:(7-Math.abs(c-3.5)-Math.abs(r-3.5))*4);v+=p[0]==='w'?x:-x}return v}
const al=s=>{const m=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=s.b[r][c];if(p&&p[0]===s.t)for(const[y,x]of lg(s,r,c))m.push([r,c,y,x])}return m};
let nd,LM;
function sr(s,d,a,b){if(d===0)return ev(s);nd++;const ms=al(s);if(!ms.length)return inchk(s)?(s.t==='w'?-9e4-d:9e4+d):0;
 ms.sort((p,q)=>!!s.b[q[2]][q[3]]-!!s.b[p[2]][p[3]]);let v=s.t==='w'?-1e9:1e9;
 for(const m of ms){const z=sr(ap(s,...m),d-1,a,b);if(s.t==='w'){v=Math.max(v,z);a=Math.max(a,v)}else{v=Math.min(v,z);b=Math.min(b,v)}if(a>=b||nd>LM)break}return v}
function pick(s,L){const ms=al(s);if(!ms.length)return null;const Dp=[1,2,3,4][L],tol=[260,45,0,0][L];LM=[1e9,1e9,1e9,15000][L];let best=null;
 for(let d=1;d<=Dp;d++){nd=0;const sc=ms.map(m=>[m,sr(ap(s,...m),d-1,-1e9,1e9)]);if(nd>LM&&d>1)break;best=sc}
 const w=s.t==='w'?1:-1;best.sort((a,b)=>(b[1]-a[1])*w);const top=best.filter(x=>Math.abs(x[1]-best[0][1])<=tol);return top[Math.random()*top.length|0][0]}

function start(m,col){gid++;think=0;mode=m;me=m==='local'?null:col;reset();bd.classList.toggle('flip',me==='b');

 if(mode==='cpu'&&S.t!==me&&!over){const g=gid;think=1;$('st').textContent='الكمبيوتر يفكر…';setTimeout(()=>{if(g!==gid)return;const m=pick(S,lvl);think=0;if(m)go(...m)},120)}}
